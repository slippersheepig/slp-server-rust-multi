name: watch-upstream-and-build

on:
  workflow_dispatch:
  schedule:
    - cron: 8 6 * * *

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.check_step.outputs.sha }}
      need_build: ${{ steps.check_step.outputs.need_build }}
    steps:
      - name: Check upstream commit against existing image
        id: check_step
        run: |
          set -eux
          # 1. 获取上游最新 master commit SHA
          SHA=$(git ls-remote https://github.com/spacemeowx2/slp-server-rust.git refs/heads/master | cut -f1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          
          # 2. 检查 Docker Hub / GHCR 上是否已经存在该 commit 的镜像 tag
          # 也可以使用 docker manifest inspect 或简单的 API curl
          SHORT_SHA=${SHA:0:7}
          if docker manifest inspect "sheepgreen/slp-server-rust:${SHORT_SHA}" > /dev/null 2>&1; then
            echo "need_build=false" >> "$GITHUB_OUTPUT"
            echo "Image for commit $SHORT_SHA already exists. Skipping."
          else
            echo "need_build=true" >> "$GITHUB_OUTPUT"
            echo "New commit $SHORT_SHA detected. Need build."
          fi

  build:
    needs: check
    if: needs.check.outputs.need_build == 'true'
    uses: ./.github/workflows/build-and-push.yml
    secrets: inherit
    with:
      slp_commit: ${{ needs.check.outputs.sha }}
